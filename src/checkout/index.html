<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

  </head>

  <body>
    <header id="main-header"></header>


    <main class="divider">
     <section class="checkout">
  <h2>Review & Place Your Order</h2>

  <form id="checkout-form">
    <fieldset>
      <legend>Customer Information</legend>

      <label>
        First Name
        <input type="text" name="fname" required />
      </label>

      <label>
        Last Name
        <input type="text" name="lname" required />
      </label>

      <label>
        Street Address
        <input type="text" name="street" required />
      </label>

      <label>
        City
        <input type="text" name="city" required />
      </label>

      <label>
        State
        <input type="text" name="state" required />
      </label>

      <label>
        Zip Code
        <input type="text" name="zip" required />
      </label>
    </fieldset>

    <fieldset>
      <legend>Payment</legend>

      <label>
        Card Number
        <input type="text" name="cardNumber" required />
      </label>

      <label>
        Expiration Date
        <input type="text" name="expiration" required />
      </label>

      <label>
        Security Code
        <input type="text" name="code" required />
      </label>
    </fieldset>

    <button type="submit">Checkout</button>
  </form>

  <section id="order-summary">
    <h3>Order Summary</h3>
    <ul>
      <li>Subtotal: <span id="subtotal"></span></li>
      <li>Tax: <span id="tax"></span></li>
      <li>Shipping: <span id="shipping"></span></li>
      <li>Total: <span id="orderTotal"></span></li>
    </ul>
  </section>
</section>
    </main>

    <footer id="main-footer"></footer>
    <script type="module" src="/js/checkout.js"></script>
  </body>
</html>
